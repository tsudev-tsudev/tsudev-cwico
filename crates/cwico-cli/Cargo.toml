[package]
name        = "cwico-cli"
description = "Headless command-line interface for tsudev-cwico."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
homepage.workspace     = true
repository.workspace   = true
license.workspace      = true

[[bin]]
name = "cwico"
path = "src/main.rs"

[dependencies]
cwico-core = { workspace = true }
serde_json = { workspace = true }
tracing    = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(windows)'.dependencies]
cwico-win = { workspace = true }

# A non-Windows build has no Windows backend to talk to, so it always uses the
# fixture one. Pulling the feature in here rather than asking the developer for
# a flag is what makes a bare `cargo test` work on any host.
[target.'cfg(not(windows))'.dependencies]
cwico-core = { workspace = true, features = ["mock"] }

[features]
default = []
# Force the fixture backend *on Windows too*, for testing the UI flow without
# touching the machine.
mock = ["cwico-core/mock"]
