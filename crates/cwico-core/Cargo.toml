[package]
name        = "cwico-core"
description = "Platform-agnostic engine for tsudev-cwico: scanning, safety classification, uninstall planning."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
homepage.workspace     = true
repository.workspace   = true
license.workspace      = true

[dependencies]
serde       = { workspace = true }
serde_json  = { workspace = true }
thiserror   = { workspace = true }
tracing     = { workspace = true }
time        = { workspace = true }
regex       = { workspace = true }

# Self-referential, so `cargo test -p cwico-core` on its own has the fixture
# backend its integration tests need. Without it the feature only arrives
# transitively from cwico-cli, and testing this crate in isolation fails.
[dev-dependencies]
cwico-core = { path = ".", features = ["mock"] }

[features]
default = []
# Deterministic in-memory backend: lets the UI and the engine be developed and
# tested on non-Windows hosts. Never enabled in release Windows builds.
mock = []
