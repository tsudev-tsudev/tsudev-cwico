name: Bug report
description: Something did not work the way it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **If the bug is that the tool removed something it should not have**,
        please report it privately instead:
        [security advisory](https://github.com/tsudev-tsudev/tsudev-cwico/security/advisories/new).

  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. cwico scan --deep
        2. Select …
        3. Review plan → Remove
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Output of `cwico info`.
      render: text
    validations:
      required: true

  - type: textarea
    id: transaction-log
    attributes:
      label: Transaction log
      description: |
        Optional but very helpful. From `%LOCALAPPDATA%\tsudev-cwico\backups\`,
        the `cwico-run-*.json` for the run that went wrong. Check it for paths
        you would rather not publish before pasting.
      render: json
