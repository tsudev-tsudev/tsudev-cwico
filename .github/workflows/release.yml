name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Create a draft GitHub release (tag pushes always do)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build installers
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm --prefix ui ci

      # A tag push publishes a draft release; a manual run just produces the
      # artefacts, so the packaging pipeline can be exercised without leaving a
      # half-finished release behind.
      - name: Build installers and draft the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Set these to sign the installers. Unsigned builds still work but
          # SmartScreen warns on first run, which for a tool that asks for
          # Administrator is a bad first impression.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app/src-tauri
          tagName: ${{ github.ref_name }}
          releaseName: tsudev-cwico ${{ github.ref_name }}
          releaseDraft: true
          args: --verbose

      - name: Build installers only
        if: "!(startsWith(github.ref, 'refs/tags/v') || inputs.publish)"
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app/src-tauri
          args: --verbose

      - name: Build the CLI
        run: cargo build -p cwico-cli --release

      - name: Record installer hashes for the winget manifest
        shell: pwsh
        run: |
          $bundle = "app/src-tauri/target/release/bundle"
          if (-not (Test-Path $bundle)) { $bundle = "target/release/bundle" }
          Get-ChildItem -Recurse -Include *.msi,*.exe $bundle |
            ForEach-Object {
              "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash, $_.Name
            } | Tee-Object -FilePath sha256sums.txt

      - uses: actions/upload-artifact@v7
        with:
          name: installers
          if-no-files-found: error
          path: |
            app/src-tauri/target/release/bundle/**/*.msi
            app/src-tauri/target/release/bundle/**/*.exe
            target/release/bundle/**/*.msi
            target/release/bundle/**/*.exe
            target/release/cwico.exe
            sha256sums.txt
